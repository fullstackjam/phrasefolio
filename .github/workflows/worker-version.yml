name: Phrasefolio Worker version

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_id:
        description: Existing version ID to deploy to 100% traffic. Leave empty to upload only.
        type: string
        required: false

permissions:
  contents: read

jobs:
  worker-version:
    name: Test and prepare Worker version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: phrasefolio-worker-${{ github.ref }}
      cancel-in-progress: false
    env:
      ACCESS_AUD: d2be50636de05c2ea26da66826056d76989334aaac2db3652f30fd66b1121bd0
      ACCESS_SERVICE_CLIENT_ID: 9ef3d2404942a9acefd2bb7a6d6746fd.access
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Check Worker bundle and bindings
        run: npm run upload-version -- --dry-run
      - name: Upload or deploy Worker version
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          WORKER_VERSION_ID: ${{ inputs.version_id }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN Actions secret before publishing."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version_output=$(mktemp "$RUNNER_TEMP/phrasefolio-version.XXXXXX")
            WRANGLER_OUTPUT_FILE_PATH="$version_output" npm run upload-version
            WORKER_VERSION_ID=$(jq -ser '[.[] | select(.type == "version-upload") | .version_id] | last // empty' "$version_output")
            current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [[ "$current_main" != "$GITHUB_SHA" ]]; then
              echo "::notice::A newer commit is on main. Skipping this deployment."
              exit 0
            fi
          elif [[ -z "$WORKER_VERSION_ID" ]]; then
            npm run upload-version
            exit 0
          fi

          if [[ ! "$WORKER_VERSION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error::Enter a valid Cloudflare Worker version ID."
            exit 1
          fi
          ./node_modules/.bin/wrangler versions deploy "$WORKER_VERSION_ID@100" --yes
