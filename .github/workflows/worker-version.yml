name: Phrasefolio Worker version

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version_id:
        description: Existing version ID to deploy to 100% traffic. Leave empty to upload only.
        type: string
        required: false

permissions:
  contents: read

jobs:
  worker-version:
    name: Test and prepare Worker version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACCESS_AUD: d2be50636de05c2ea26da66826056d76989334aaac2db3652f30fd66b1121bd0
      ACCESS_SERVICE_CLIENT_ID: 9ef3d2404942a9acefd2bb7a6d6746fd.access
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Check Worker bundle and bindings
        run: npm run upload-version -- --dry-run
      - name: Upload or deploy Worker version
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_VERSION_ID: ${{ inputs.version_id }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN Actions secret before uploading."
            exit 1
          fi
          if [[ -z "$WORKER_VERSION_ID" ]]; then
            npm run upload-version
          elif [[ "$WORKER_VERSION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            ./node_modules/.bin/wrangler versions deploy "$WORKER_VERSION_ID@100" --yes
          else
            echo "::error::Enter a valid Cloudflare Worker version ID."
            exit 1
          fi
