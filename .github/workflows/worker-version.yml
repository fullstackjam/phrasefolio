name: Phrasefolio Worker version

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-version:
    name: Test and prepare Worker version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACCESS_AUD: d2be50636de05c2ea26da66826056d76989334aaac2db3652f30fd66b1121bd0
      ACCESS_SERVICE_CLIENT_ID: 9ef3d2404942a9acefd2bb7a6d6746fd.access
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Check Worker bundle and bindings
        run: npm run upload-version -- --dry-run
      - name: Upload Worker version
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN Actions secret before uploading."
            exit 1
          fi
          npm run upload-version
